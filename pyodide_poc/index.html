<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>pyspider Pyodide PoC</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #0f1115;
    color: #d9e1ec;
    margin: 0;
    padding: 24px;
  }
  h1 { margin-top: 0; font-size: 20px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 16px; }
  .card {
    background: #1a1d24;
    border: 1px solid #2c313c;
    border-radius: 10px;
    padding: 16px;
  }
  .card h3 { margin: 0 0 8px 0; font-size: 13px; color: #8fa0b4; font-weight: 500; }
  canvas {
    image-rendering: pixelated;
    background: #000;
    display: block;
    border-radius: 6px;
  }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  button {
    background: #2c6cf6; color: white; border: 0;
    padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  button:disabled { background: #4b5564; cursor: wait; }
  input[type="range"] { accent-color: #2c6cf6; }
  input[type="number"] {
    width: 60px; background: #0f1115; color: #d9e1ec;
    border: 1px solid #2c313c; padding: 4px 6px; border-radius: 4px;
  }
  pre {
    background: #0b0c10; color: #7fdbff; padding: 12px; border-radius: 6px;
    font-size: 11px; max-height: 240px; overflow: auto; margin: 0;
  }
  .status { color: #ffd166; font-size: 12px; }
  .ok { color: #7fdbff; }
</style>
</head>
<body>
<h1>pyspider · Pyodide PoC</h1>
<p class="status" id="status">Booting Pyodide…</p>

<div class="row">
  <div class="card">
    <h3>Siemens star (numpy only)</h3>
    <canvas id="c-siemens" width="256" height="256"></canvas>
    <div class="controls">
      <label>N spokes <input id="spokes" type="number" value="24" min="4" max="64"></label>
      <button id="btn-siemens" disabled>Generate</button>
    </div>
  </div>

  <div class="card">
    <h3>geom.rotate (scipy.ndimage)</h3>
    <canvas id="c-rotate" width="256" height="256"></canvas>
    <div class="controls">
      <label>angle_deg <input id="angle" type="number" value="30" step="1"></label>
      <label>interp
        <select id="interp">
          <option value="1">linear</option>
          <option value="0">nearest</option>
          <option value="3">cubic</option>
        </select>
      </label>
      <button id="btn-rotate" disabled>Run</button>
    </div>
  </div>
</div>

<div class="row">
  <div class="card" style="flex:1; min-width: 600px;">
    <h3>Log</h3>
    <pre id="log"></pre>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const log = (msg) => { logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; };

let pyodide = null;

async function boot() {
  const t0 = performance.now();
  log("Loading Pyodide runtime (~12 MB)…");
  pyodide = await loadPyodide();
  log(`Pyodide ready (${((performance.now() - t0)/1000).toFixed(1)}s)`);

  log("Loading numpy + scipy…");
  const t1 = performance.now();
  await pyodide.loadPackage(["numpy", "scipy"]);
  log(`numpy + scipy loaded (${((performance.now() - t1)/1000).toFixed(1)}s)`);

  // Inline the two kernel functions we need. Lifted directly from
  // pyspider.testdata.siemens_star and a scipy.ndimage.rotate wrapper.
  await pyodide.runPythonAsync(`
import numpy as np
from scipy import ndimage as ndi

def siemens_star(N=256, n_spokes=24):
    y, x = np.mgrid[0:N, 0:N].astype(np.float32)
    cx, cy = (N - 1) / 2, (N - 1) / 2
    theta = np.arctan2(y - cy, x - cx)
    r = np.sqrt((x - cx) ** 2 + (y - cy) ** 2)
    R_max = N / 2 * 0.92
    pattern = (np.cos(n_spokes * theta) > 0).astype(np.float32)
    mask = (r < R_max).astype(np.float32)
    return (pattern * mask).astype(np.float32)

def rotate_image(img, angle_deg, order=1):
    return ndi.rotate(img, angle_deg, reshape=False,
                      order=int(order), mode="constant", cval=0.0).astype(np.float32)

def to_rgba_bytes(img):
    """Map a float32 [0,1] array into an RGBA uint8 buffer the canvas can paint."""
    a = np.clip(img, 0.0, 1.0)
    g = (a * 255).astype(np.uint8)
    H, W = g.shape
    out = np.empty((H, W, 4), dtype=np.uint8)
    out[..., 0] = g
    out[..., 1] = g
    out[..., 2] = g
    out[..., 3] = 255
    return out.tobytes()
`);
  log("Kernel loaded.");
  statusEl.textContent = "Ready.";
  statusEl.classList.add("ok");
  document.getElementById("btn-siemens").disabled = false;
  document.getElementById("btn-rotate").disabled = false;
}

let latestSiemens = null;  // Py-side variable name we reuse

function paintCanvas(canvasId, bytes, w, h) {
  const canvas = document.getElementById(canvasId);
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const u8 = new Uint8ClampedArray(bytes);
  const imgData = new ImageData(u8, w, h);
  ctx.putImageData(imgData, 0, 0);
}

async function generateSiemens() {
  const spokes = parseInt(document.getElementById("spokes").value);
  const t0 = performance.now();
  await pyodide.runPythonAsync(`
img_siemens = siemens_star(N=256, n_spokes=${spokes})
_rgba = to_rgba_bytes(img_siemens)
`);
  const bytes = pyodide.globals.get("_rgba").toJs();
  paintCanvas("c-siemens", bytes, 256, 256);
  log(`siemens_star: ${(performance.now() - t0).toFixed(1)} ms`);
  latestSiemens = true;
}

async function runRotate() {
  if (!latestSiemens) {
    await generateSiemens();
  }
  const angle = parseFloat(document.getElementById("angle").value);
  const order = parseInt(document.getElementById("interp").value);
  const t0 = performance.now();
  await pyodide.runPythonAsync(`
img_rot = rotate_image(img_siemens, ${angle}, order=${order})
_rgba = to_rgba_bytes(img_rot)
`);
  const bytes = pyodide.globals.get("_rgba").toJs();
  paintCanvas("c-rotate", bytes, 256, 256);
  log(`rotate (${angle}deg, order=${order}): ${(performance.now() - t0).toFixed(1)} ms`);
}

document.getElementById("btn-siemens").addEventListener("click", generateSiemens);
document.getElementById("btn-rotate").addEventListener("click", runRotate);

boot().catch(e => {
  log("ERROR: " + e.message);
  statusEl.textContent = "Boot failed.";
});
</script>
</body>
</html>
